<script>
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.querySelector('.play-btn');
    let currentQueue = [];
    let currentIndex = 0;

    function formatTime(seconds) {
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? '0' + sec : sec}`;
    }

    // Call your Vercel Serverless Function
    async function searchSongs() {
        const query = document.getElementById('searchInput').value;
        if(!query) return;
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '<div class="loading">Loading...</div>';

        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            if (!res.ok) throw new Error("Failed to fetch search results");
            
            const data = await res.json();
            const songs = data.results || [];
            
            if(songs.length === 0) {
                resultsDiv.innerHTML = '<div class="loading">No songs found.</div>';
                return;
            }

            currentQueue = songs;
            resultsDiv.innerHTML = '';
            
            songs.forEach((song, index) => {
                // Safely extract text
                const title = song.title ? song.title.replace(/&quot;/g, '"').replace(/&amp;/g, '&') : 'Unknown';
                const artist = song.primary_artists ? song.primary_artists.replace(/&quot;/g, '"').replace(/&amp;/g, '&') : 'Unknown Artist';
                
                // Safely extract and upgrade image quality
                let img = song.image || ''; 
                if (img && img.includes('150x150')) {
                    img = img.replace('150x150', '500x500');
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${img}" alt="${title}" onerror="this.src='https://via.placeholder.com/150'">
                    <h3>${title}</h3>
                    <p>${artist}</p>
                `;
                card.onclick = () => playSong(index);
                resultsDiv.appendChild(card);
            });
        } catch (error) {
            console.error("Error fetching songs:", error);
            resultsDiv.innerHTML = '<div class="loading">Error loading songs. Check console.</div>';
        }
    }

    async function playSong(index) {
        currentIndex = index;
        const song = currentQueue[index];
        
        // Update UI
        document.getElementById('currentTitle').innerText = song.title.replace(/&quot;/g, '"');
        document.getElementById('currentArtist').innerText = song.primary_artists.replace(/&quot;/g, '"');
        
        let img = song.image || '';
        if (img && img.includes('150x150')) img = img.replace('150x150', '500x500');
        document.getElementById('currentImg').src = img;

        playBtn.innerText = '⏳'; // Loading state

        try {
            // Safely access the encrypted URL
            const encryptedUrl = song?.more_info?.encrypted_media_url;
            
            if (!encryptedUrl) {
                throw new Error("Encrypted media URL not found for this track.");
            }

            // Call Serverless Function to get playable URL
            const res = await fetch(`/api/song?url=${encodeURIComponent(encryptedUrl)}`);
            
            if (!res.ok) {
                const errorData = await res.json();
                throw new Error(errorData.error || "Failed to get playable URL");
            }

            const data = await res.json();
            
            if(data.auth_url) {
                audioPlayer.src = data.auth_url;
                // Play and catch autoplay block errors
                audioPlayer.play().catch(e => console.log("Autoplay blocked by browser:", e));
                playBtn.innerText = '⏸️';
            } else {
                throw new Error("Auth URL missing in API response.");
            }
        } catch (error) {
            console.error("Error playing song:", error);
            alert("Could not play this song: " + error.message);
            playBtn.innerText = '▶️';
        }
    }

    function togglePlay() {
        if (audioPlayer.paused) {
            audioPlayer.play().catch(e => console.log(e));
            playBtn.innerText = '⏸️';
        } else {
            audioPlayer.pause();
            playBtn.innerText = '▶️';
        }
    }

    audioPlayer.addEventListener('timeupdate', () => {
        const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100 || 0;
        document.getElementById('progressFilled').style.width = percent + '%';
        document.getElementById('currentTime').innerText = formatTime(audioPlayer.currentTime);
        document.getElementById('duration').innerText = formatTime(audioPlayer.duration);
    });

    function seek(e) {
        const progressBar = document.getElementById('progressBar');
        const clickX = (e.offsetX / progressBar.offsetWidth);
        audioPlayer.currentTime = clickX * audioPlayer.duration;
    }

    audioPlayer.addEventListener('ended', () => {
        if (currentIndex < currentQueue.length - 1) {
            playSong(currentIndex + 1);
        }
    });

    // Load default songs on start
    window.onload = searchSongs;
</script>
